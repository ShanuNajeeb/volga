services:
  - type: web
    name: volga-storefront
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /favicon.ico
    buildCommand: >-
      corepack pnpm --filter @dtc/storefront install --frozen-lockfile --prod=false &&
      corepack pnpm --filter @dtc/storefront run build
    startCommand: >-
      cd apps/storefront &&
      node node_modules/next/dist/bin/next start -H 0.0.0.0 -p "$PORT"
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NEXT_PUBLIC_BASE_URL
        value: https://volga.walloura.com
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        value: https://volga.walloura.com
      - key: MEDUSA_INTERNAL_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
