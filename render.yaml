services:
  - type: web
    name: volga-medusa
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --prod=false &&
      corepack pnpm --filter @dtc/backend run build &&
      corepack pnpm --filter @dtc/backend exec medusa db:migrate &&
      corepack pnpm --filter @dtc/backend exec medusa exec ./src/scripts/show-publishable-key.ts
    startCommand: >-
      cd apps/backend/.medusa/server &&
      NODE_ENV=production node ../../node_modules/@medusajs/cli/cli.js start -H 0.0.0.0 -p "$PORT"
    initialDeployHook: >-
      corepack pnpm --filter @dtc/backend exec medusa user
      -e "$VOLGA_ADMIN_EMAIL" -p "$VOLGA_ADMIN_PASSWORD"
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: DATABASE_URL
        fromDatabase:
          name: volga-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: VOLGA_ADMIN_EMAIL
        value: preview@volga.test
      - key: VOLGA_ADMIN_PASSWORD
        generateValue: true
      - key: STORE_CORS
        value: https://volga.walloura.com
      - key: ADMIN_CORS
        value: https://volga.walloura.com
      - key: AUTH_CORS
        value: https://volga.walloura.com

databases:
  - name: volga-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
